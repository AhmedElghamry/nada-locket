<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Nada's Locket</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    /* ---------- tokens ---------- */
    :root {
      --void: #1c0f14;
      --void-2: #120a0d;
      --wine: #3d1a2b;
      --wine-2: #2a1220;
      --rosewood: #7a2e40;
      --gold: #c9a05c;
      --gold-soft: #e4c98a;
      --gold-dim: rgba(201, 160, 92, 0.35);
      --blush: #e8b4bc;
      --ivory: #f3e9e4;
      --ivory-dim: rgba(243, 233, 228, 0.62);
      --err: #d98a7a;
      --font-script: 'Marck Script', cursive;
      --font-head: 'Cormorant Garamond', 'Iowan Old Style', serif;
      --font-body: 'EB Garamond', Georgia, serif;
      --font-ui: 'Jost', 'Segoe UI', sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }

    body {
      background:
        radial-gradient(60% 50% at 50% 8%, rgba(201, 160, 92, 0.14), transparent 60%),
        radial-gradient(80% 60% at 50% 100%, rgba(122, 46, 64, 0.35), transparent 65%),
        var(--void);
      color: var(--ivory);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow-x: hidden;
    }

    @media (prefers-reduced-motion: no-preference) {
      .bokeh {
        animation: drift linear infinite;
      }
    }

    h1,
    h2,
    h3 {
      text-wrap: balance;
      margin: 0;
    }

    /* ---------- ambient background ---------- */
    .ambient {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }

    .bokeh {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(228, 201, 138, 0.55), rgba(228, 201, 138, 0) 70%);
      filter: blur(1px);
      opacity: .55;
    }

    @keyframes drift {
      0% {
        transform: translateY(0) translateX(0);
      }

      50% {
        transform: translateY(-26px) translateX(10px);
      }

      100% {
        transform: translateY(0) translateX(0);
      }
    }

    /* ---------- stage ---------- */
    .stage {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 16px 36px;
      gap: 18px;
    }

    .progress {
      display: flex;
      gap: 9px;
      align-items: center;
    }

    .progress .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(243, 233, 228, 0.18);
      border: 1px solid var(--gold-dim);
      transition: background .3s, transform .3s;
    }

    .progress .dot.done {
      background: var(--gold);
      border-color: var(--gold);
    }

    .progress .dot.current {
      background: var(--blush);
      border-color: var(--blush);
      transform: scale(1.3);
    }

    .progress .dot.done {
      cursor: pointer;
    }

    .progress .dot.done:hover {
      transform: scale(1.25);
    }

    .locket {
      position: relative;
      width: 100%;
      max-width: 480px;
      background: linear-gradient(180deg, var(--wine) 0%, var(--wine-2) 100%);
      border-radius: 22px;
      border: 1px solid var(--gold-dim);
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.55), inset 0 0 0 1px rgba(0, 0, 0, 0.2);
      max-height: calc(100vh - 120px);
    }

    .locket-scroll {
      max-height: inherit;
      overflow-y: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding: 52px 28px 30px;
    }

    .locket-scroll::-webkit-scrollbar {
      display: none;
    }

    .back-btn {
      position: absolute;
      top: 14px;
      left: 14px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.22);
      border: 1px solid var(--gold-dim);
      color: var(--gold-soft);
      font-family: var(--font-ui);
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      z-index: 3;
      transition: background .15s, transform .15s;
    }

    .back-btn:hover {
      background: rgba(0, 0, 0, 0.36);
      transform: translateX(-2px);
    }

    .locket::before,
    .locket::after,
    .locket .corner-tl,
    .locket .corner-tr,
    .locket .corner-bl,
    .locket .corner-br {
      content: '';
      position: absolute;
      width: 34px;
      height: 34px;
      pointer-events: none;
      border: 1.5px solid var(--gold-dim);
      opacity: .8;
    }

    .corner-tl {
      top: 9px;
      left: 9px;
      border-right: none;
      border-bottom: none;
      border-radius: 8px 0 0 0;
    }

    .corner-tr {
      top: 9px;
      right: 9px;
      border-left: none;
      border-bottom: none;
      border-radius: 0 8px 0 0;
    }

    .corner-bl {
      bottom: 9px;
      left: 9px;
      border-right: none;
      border-top: none;
      border-radius: 0 0 0 8px;
    }

    .corner-br {
      bottom: 9px;
      right: 9px;
      border-left: none;
      border-top: none;
      border-radius: 0 0 8px 0;
    }

    .eyebrow {
      font-family: var(--font-ui);
      font-size: 11px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--gold-soft);
      text-align: center;
      margin-bottom: 10px;
    }

    .headline {
      font-family: var(--font-head);
      font-style: italic;
      font-weight: 600;
      font-size: clamp(22px, 6vw, 30px);
      text-align: center;
      line-height: 1.25;
      color: var(--ivory);
      margin-bottom: 6px;
    }

    .sub {
      font-family: var(--font-body);
      font-size: 16px;
      text-align: center;
      color: var(--ivory-dim);
      line-height: 1.6;
      margin: 0 auto 6px;
    }

    .script {
      font-family: var(--font-script);
      color: var(--gold-soft);
      font-size: 1.15em;
    }

    .divider {
      width: 64px;
      height: 1px;
      margin: 18px auto;
      background: var(--gold-dim);
      position: relative;
    }

    .divider::after {
      content: '✦';
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      color: var(--gold);
      font-size: 11px;
      background: var(--wine);
      padding: 0 8px;
    }

    /* ---------- buttons & inputs ---------- */
    .btn {
      font-family: var(--font-ui);
      font-size: 13px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--void);
      background: linear-gradient(180deg, var(--gold-soft), var(--gold));
      border: none;
      border-radius: 999px;
      padding: 13px 30px;
      cursor: pointer;
      display: block;
      margin: 0 auto;
      box-shadow: 0 8px 20px rgba(201, 160, 92, 0.28);
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(201, 160, 92, 0.4);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn:focus-visible,
    .choice-seal:focus-visible,
    .lockbox input:focus-visible,
    .text-answer input:focus-visible {
      outline: 2px solid var(--blush);
      outline-offset: 3px;
    }

    .btn.ghost {
      background: transparent;
      color: var(--gold-soft);
      border: 1px solid var(--gold-dim);
      box-shadow: none;
    }

    .btn.small {
      padding: 9px 20px;
      font-size: 11px;
    }

    .text-answer {
      margin-top: 22px;
    }

    .text-answer input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--gold-dim);
      color: var(--ivory);
      font-family: var(--font-body);
      font-size: 18px;
      text-align: center;
      padding: 8px 4px;
      outline: none;
    }

    .text-answer input:focus {
      border-bottom-color: var(--gold);
    }

    .text-answer .btn {
      margin-top: 18px;
    }

    .choices {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 22px;
    }

    .choice-seal {
      font-family: var(--font-body);
      font-size: 16px;
      color: var(--ivory);
      background: rgba(243, 233, 228, 0.04);
      border: 1px solid var(--gold-dim);
      border-radius: 14px;
      padding: 13px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color .15s, background .15s, transform .15s;
    }

    .choice-seal:hover {
      border-color: var(--gold);
      background: rgba(201, 160, 92, 0.08);
    }

    .choice-seal.wrong {
      border-color: var(--err);
      animation: shake .4s;
    }

    .choice-seal.right {
      border-color: var(--gold);
      background: rgba(201, 160, 92, 0.18);
    }

    .lockbox {
      display: flex;
      gap: clamp(5px, 1.8vw, 10px);
      justify-content: center;
      margin-top: 24px;
    }

    .lockbox input {
      width: clamp(28px, 9vw, 46px);
      height: clamp(38px, 12vw, 56px);
      text-align: center;
      font-family: var(--font-ui);
      font-size: clamp(15px, 4.5vw, 22px);
      font-variant-numeric: tabular-nums;
      color: var(--ivory);
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--gold-dim);
      border-radius: 10px;
      outline: none;
      padding: 0;
    }

    .lockbox input:focus {
      border-color: var(--gold);
      background: rgba(0, 0, 0, 0.32);
    }

    .lockbox-label {
      text-align: center;
      font-family: var(--font-ui);
      font-size: 10px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--ivory-dim);
      margin-top: 10px;
    }

    .lockbox .btn {
      margin-top: 20px;
    }

    .shake {
      animation: shake .4s;
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(0);
      }

      20% {
        transform: translateX(-7px);
      }

      40% {
        transform: translateX(6px);
      }

      60% {
        transform: translateX(-4px);
      }

      80% {
        transform: translateX(3px);
      }
    }

    .hint {
      text-align: center;
      font-family: var(--font-ui);
      font-size: 12px;
      letter-spacing: .04em;
      color: var(--blush);
      margin-top: 14px;
      min-height: 14px;
    }

    /* ---------- scratch reveal ---------- */
    .reveal-wrap {
      margin-top: 6px;
    }

    .photo-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 4/5;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--gold-dim);
      background: var(--void-2);
    }

    .photo-frame img,
    .photo-frame video,
    .photo-placeholder {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: var(--void-2);
    }

    .photo-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 6px;
      background: linear-gradient(160deg, #4a2033, #241019);
    }

    .photo-placeholder .mono {
      font-family: var(--font-script);
      font-size: 34px;
      color: var(--gold-soft);
    }

    .photo-placeholder small {
      font-family: var(--font-ui);
      font-size: 9px;
      letter-spacing: .15em;
      color: var(--ivory-dim);
      text-transform: uppercase;
    }

    .scratch-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }

    .scratch-hint {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 10px;
      text-align: center;
      pointer-events: none;
      font-family: var(--font-ui);
      font-size: 10px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: rgba(28, 15, 20, 0.55);
    }

    .scratch-hint-label {
      text-align: center;
      margin-top: 10px;
      font-family: var(--font-ui);
      font-size: 10px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--ivory-dim);
    }

    .wax-seal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 84px;
      height: 84px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 35% 30%, #d9435a 0%, #9c2436 55%, #6b1526 100%);
      box-shadow:
        0 10px 26px rgba(0, 0, 0, 0.5),
        inset 0 2px 4px rgba(255, 255, 255, 0.25),
        inset 0 -6px 10px rgba(0, 0, 0, 0.4);
      transition: transform .3s ease, opacity .45s ease;
    }

    .wax-seal-icon {
      font-size: 26px;
      color: rgba(255, 255, 255, 0.85);
      filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.4));
    }

    .wax-seal:hover {
      transform: translate(-50%, -50%) scale(1.05);
    }

    .wax-seal.melt {
      transform: translate(-50%, -50%) scale(1.3);
      opacity: 0;
    }

    .reveal-skip {
      display: block;
      margin: 10px auto 0;
      background: none;
      border: none;
      color: var(--ivory-dim);
      font-family: var(--font-ui);
      font-size: 10px;
      letter-spacing: .1em;
      text-decoration: underline;
      cursor: pointer;
    }

    .memory-text {
      font-family: var(--font-body);
      font-style: italic;
      font-size: 17px;
      line-height: 1.65;
      color: var(--ivory);
      text-align: center;
      margin-top: 18px;
      opacity: 0;
      transform: translateY(6px);
      animation: rise .6s ease forwards;
    }

    .memory-title {
      font-family: var(--font-head);
      font-weight: 600;
      font-size: 20px;
      text-align: center;
      color: var(--gold-soft);
      margin-top: 16px;
      opacity: 0;
      transform: translateY(6px);
      animation: rise .6s ease forwards;
    }

    @keyframes rise {
      to {
        opacity: 1;
        transform: none;
      }
    }

    .continue-btn {
      margin-top: 22px;
    }

    /* ---------- cover ---------- */
    .cover-crest {
      text-align: center;
      font-size: 30px;
      margin-bottom: 4px;
    }

    .cover-name {
      font-family: var(--font-script);
      font-size: clamp(38px, 11vw, 54px);
      color: var(--gold-soft);
      text-align: center;
      line-height: 1;
    }

    .cover-age {
      font-family: var(--font-ui);
      text-align: center;
      letter-spacing: .3em;
      font-size: 12px;
      color: var(--blush);
      text-transform: uppercase;
      margin-top: 6px;
    }

    /* ---------- finale ---------- */
    .petals {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      overflow: hidden;
    }

    .petal {
      position: absolute;
      top: -5%;
      font-size: 16px;
      opacity: .85;
    }

    @media (prefers-reduced-motion: no-preference) {
      .petal {
        animation: fall linear forwards;
      }
    }

    @keyframes fall {
      to {
        transform: translateY(115vh) translateX(var(--drift, 0px)) rotate(360deg);
        opacity: .2;
      }
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 20px;
    }

    .gallery button {
      padding: 0;
      border: 1px solid var(--gold-dim);
      border-radius: 8px;
      overflow: hidden;
      background: var(--void-2);
      cursor: pointer;
      aspect-ratio: 1;
    }

    .gallery img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .gallery .ph {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-script);
      color: var(--gold-dim);
      font-size: 20px;
    }

    .modal-back {
      position: fixed;
      inset: 0;
      background: rgba(10, 5, 7, 0.78);
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-card {
      background: var(--wine);
      border: 1px solid var(--gold-dim);
      border-radius: 18px;
      padding: 22px;
      max-width: 420px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .modal-card::-webkit-scrollbar {
      display: none;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 420px) {
      .locket {
        padding: 26px 18px 24px;
      }
    }
  </style>
</head>

<body>

  <div class="ambient" id="ambient"></div>
  <div class="petals" id="petals" hidden></div>

  <div class="stage">
    <div class="progress" id="progress"></div>
    <div class="locket" id="locket">
      <div class="corner-tl"></div>
      <div class="corner-tr"></div>
      <div class="corner-bl"></div>
      <div class="corner-br"></div>
      <button class="back-btn" id="backBtn" hidden>‹</button>
      <div class="locket-scroll">
        <div id="screen"></div>
      </div>
    </div>
  </div>

  <div class="modal-back" id="modalBack" hidden>
    <div class="modal-card" id="modalCard"></div>
  </div>

  <script>
    /* =========================================================================
       EDIT ME — this is the only section you need to touch to personalize
       the hunt. Each "stop" is one chapter: a riddle/puzzle, then a photo +
       memory that unlocks once it's solved.
    
       type: "text"   -> she types an answer.  acceptedAnswers: array of
                          acceptable strings (lowercase, accents/spacing ignored)
       type: "choice" -> she picks from 2-4 wax-seal options. correct: index
       type: "lock"   -> she enters a 4-digit code (e.g. a meaningful date)
    
       image: leave as null to show a placeholder frame, or replace with a
       base64 data URI ("data:image/jpeg;base64,...") once photos are ready.
       ========================================================================= */
    const STOPS = [
      {
        chapter: "Chapter One",
        riddle: "Before we open this locket properly — where did two strangers first become “us”? Type the place.",
        type: "text",
        acceptedAnswers: ["il Nilo"],
        hint: "Think about the very first time our eyes met.",
        memoryTitle: "Where It Began",
        memoryText: "I read our messages a lot at that time — it surprises me how we got that close in such a little time, as if we knew each other. When we had our first date there, we were just colleagues, friends, not more than that.<br><br>Once I saw you, the real you, I opened my heart hoping that you could save me from what I had been through. You did a lot. You fixed my heart and brought me back to life again, the real me that you found and knew without even seeing it.<br><br>My words can't express how grateful I am to have you. My heart, soul, and mind mate. Luv u ❤",

      },
      {
        chapter: "Chapter Six",
        riddle: "One more before the last page — pick the nickname that's really, truly yours.",
        type: "choice",
        choices: ["Habibti", "Noony", "Love"],
        correct: 0,
        memoryTitle: "Only Hers",
        memoryText: "Replace this with why that nickname exists, or a memory tied to it.",
        image: null
      }
    ];

    const FINALE = {
      title: "Happy 23rd, my love",
      message: "Replace this with your birthday letter to Nada — everything you want her to know today.",
    };

    /* ========================================================================= */

    const STORAGE_KEY = "nadas-locket-progress-v1";
    const screenEl = document.getElementById('screen');
    const progressEl = document.getElementById('progress');
    const backBtn = document.getElementById('backBtn');
    const lockedTypeAnnounce = new Set();

    function setBack(targetIndex) {
      if (targetIndex === undefined) {
        backBtn.hidden = true;
        backBtn.onclick = null;
      } else {
        backBtn.hidden = false;
        backBtn.onclick = () => go(targetIndex);
      }
    }

    function loadProgress() {
      const fallback = { index: -1, unlocked: [], revealed: [] };
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return fallback;
        const p = JSON.parse(raw);
        if (typeof p.index !== 'number' || !Array.isArray(p.unlocked)) return fallback;
        if (!Array.isArray(p.revealed)) p.revealed = [];
        return p;
      } catch (e) { return fallback; }
    }
    function saveProgress() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { }
    }

    let state = loadProgress(); // index: -1 = cover, 0..N-1 = stops, N = finale

    function normalize(s) {
      return s.toLowerCase().trim()
        .normalize('NFD').replace(/[̀-ͯ]/g, '')
        .replace(/\s+/g, ' ');
    }

    function renderProgress() {
      progressEl.innerHTML = '';
      if (state.index < 0) { return; }
      STOPS.forEach((_, i) => {
        const unlocked = state.unlocked.includes(i);
        const d = document.createElement('div');
        d.className = 'dot' + (unlocked ? ' done' : '') + (i === state.index ? ' current' : '');
        if (unlocked) {
          d.title = STOPS[i].memoryTitle;
          d.addEventListener('click', () => go(i));
        }
        progressEl.appendChild(d);
      });
    }

    function go(index) {
      state.index = index;
      saveProgress();
      render();
    }

    function render() {
      renderProgress();
      if (state.index === -1) { renderCover(); return; }
      if (state.index >= STOPS.length) { renderFinale(); return; }
      const stop = STOPS[state.index];
      if (state.unlocked.includes(state.index)) {
        renderSolved(stop, state.index);
      } else {
        renderRiddle(stop, state.index);
      }
    }

    function renderCover() {
      setBack(undefined);
      const keepFirst = state.revealed.includes(0) ? [0] : [];
      if (state.revealed.length !== keepFirst.length) {
        state.revealed = keepFirst;
        saveProgress();
      }
      screenEl.innerHTML = `
    <div class="cover-crest">🕯️</div>
    <div class="eyebrow">Happy Birthday, my love</div>
    <div class="cover-name">Nada</div>
    <div class="cover-age">Twenty-Three</div>
    <div class="divider"></div>
    <p class="sub">I wanted to give you something only the two of us could understand. I'll take you on the best journey I have ever had, till the infinity and beyond — come with me!</p>
    <button class="btn" id="beginBtn" style="margin-top:20px;">Open the Locket</button>
  `;
      document.getElementById('beginBtn').addEventListener('click', () => go(0));
    }

    function renderRiddle(stop, i) {
      setBack(i - 1);
      const bodyHtml = ({
        text: () => `
      <div class="text-answer">
        <input type="text" id="answerInput" placeholder="Your answer…" autocomplete="off" />
        <button class="btn" id="submitBtn">Unlock</button>
      </div>
      <div class="hint" id="hintLine"></div>
    `,
        choice: () => `
      <div class="choices" id="choicesWrap">
        ${stop.choices.map((c, idx) => `<div class="choice-seal" data-idx="${idx}">${c}</div>`).join('')}
      </div>
      <div class="hint" id="hintLine"></div>
    `,
        lock: () => `
      <div class="lockbox" id="lockboxWrap">
        ${Array.from({ length: stop.code.length }, (_, n) => `<input inputmode="numeric" pattern="[0-9]*" maxlength="1" data-pos="${n}" />`).join('')}
      </div>
      <div class="lockbox-label">${(stop.codeLabel || 'MM MM DD DD').split(' ').join(' &nbsp; ')}</div>
      <button class="btn" id="submitBtn">Unlock</button>
      <div class="hint" id="hintLine"></div>
    `
      })[stop.type]();

      screenEl.innerHTML = `
    <div class="eyebrow">${stop.chapter}</div>
    <h2 class="headline">${stop.riddle}</h2>
    ${bodyHtml}
  `;

      const hintLine = document.getElementById('hintLine');
      let attempts = 0;

      function onWrong(el) {
        if (el) { el.classList.add('shake'); setTimeout(() => el.classList.remove('shake'), 400); }
        attempts++;
        if (attempts >= 2 && stop.hint) { hintLine.textContent = 'Hint: ' + stop.hint; }
      }

      function unlock() {
        if (!state.unlocked.includes(i)) state.unlocked.push(i);
        saveProgress();
        render();
      }

      if (stop.type === 'text') {
        const input = document.getElementById('answerInput');
        const submit = () => {
          const val = normalize(input.value);
          const ok = stop.acceptedAnswers.some(a => normalize(a) === val);
          if (ok) unlock(); else onWrong(input);
        };
        document.getElementById('submitBtn').addEventListener('click', submit);
        input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
      }

      if (stop.type === 'choice') {
        document.querySelectorAll('.choice-seal').forEach(btn => {
          btn.addEventListener('click', () => {
            const idx = Number(btn.dataset.idx);
            if (idx === stop.correct) {
              btn.classList.add('right');
              setTimeout(unlock, 350);
            } else {
              onWrong(btn);
            }
          });
        });
      }

      if (stop.type === 'lock') {
        const inputs = Array.from(document.querySelectorAll('.lockbox input'));
        inputs.forEach((inp, idx) => {
          inp.addEventListener('input', () => {
            inp.value = inp.value.replace(/[^0-9]/g, '').slice(0, 1);
            if (inp.value && inputs[idx + 1]) inputs[idx + 1].focus();
          });
          inp.addEventListener('keydown', e => {
            if (e.key === 'Backspace' && !inp.value && inputs[idx - 1]) inputs[idx - 1].focus();
          });
        });
        document.getElementById('submitBtn').addEventListener('click', () => {
          const code = inputs.map(i => i.value || '').join('');
          if (code.length === stop.code.length && code === stop.code) {
            unlock();
          } else {
            document.getElementById('lockboxWrap').classList.add('shake');
            setTimeout(() => document.getElementById('lockboxWrap').classList.remove('shake'), 400);
            attempts++;
            if (attempts >= 2 && stop.hint) { hintLine.textContent = 'Hint: ' + stop.hint; }
          }
        });
      }
    }

    function renderSolved(stop, i) {
      setBack(i - 1);
      const isLast = i === STOPS.length - 1;
      const alreadyRevealed = state.revealed.includes(i);
      const isVideo = !!stop.video;

      const mediaHtml = isVideo
        ? `<video id="chapterMedia" playsinline preload="metadata"${alreadyRevealed ? ' controls' : ''}></video>`
        : (stop.image
          ? `<img src="${stop.image}" alt="${stop.memoryTitle}" />`
          : `<div class="photo-placeholder"><div class="mono">✦</div><small>Photo goes here</small></div>`);

      screenEl.innerHTML = `
    <div class="eyebrow">${stop.chapter} · Unlocked</div>
    <div class="reveal-wrap">
      <div class="photo-frame"${isVideo ? ' style="aspect-ratio:16/9;"' : ''} id="photoFrame">
        ${mediaHtml}
        ${alreadyRevealed ? '' : (isVideo
          ? `<button class="wax-seal" id="waxSeal" aria-label="Break the seal to play the video"><span class="wax-seal-icon">❤</span></button>`
          : `<canvas class="scratch-canvas" id="scratchCanvas"></canvas>`)}
      </div>
      ${alreadyRevealed ? '' : (isVideo
          ? `<div class="scratch-hint-label">break the seal to watch</div>`
          : `<button class="reveal-skip" id="revealSkip">having trouble scratching? tap to reveal</button>`)}
    </div>
    <div class="memory-title" id="memTitle"${alreadyRevealed ? '' : ' hidden'}>${stop.memoryTitle}</div>
    <p class="memory-text" id="memText"${alreadyRevealed ? '' : ' hidden'}>${stop.memoryText}</p>
    <button class="btn continue-btn" id="continueBtn"${alreadyRevealed ? '' : ' hidden'}>${isLast ? 'Read the last page' : 'Continue'}</button>
  `;

      document.getElementById('continueBtn').addEventListener('click', () => go(i + 1));

      if (isVideo) {
        document.getElementById('chapterMedia').src = stop.video;
      }

      if (alreadyRevealed) return;

      function finishReveal() {
        document.getElementById('memTitle').hidden = false;
        document.getElementById('memText').hidden = false;
        document.getElementById('continueBtn').hidden = false;
        if (!state.revealed.includes(i)) state.revealed.push(i);
        saveProgress();
      }

      if (isVideo) {
        let opened = false;
        const seal = document.getElementById('waxSeal');
        const videoEl = document.getElementById('chapterMedia');
        seal.addEventListener('click', () => {
          if (opened) return;
          opened = true;
          seal.classList.add('melt');
          videoEl.setAttribute('controls', '');
          videoEl.play().catch(() => { });
          setTimeout(() => seal.remove(), 450);
          finishReveal();
        });
        return;
      }

      const frame = document.getElementById('photoFrame');
      const canvas = document.getElementById('scratchCanvas');
      const ctx = canvas.getContext('2d');
      let revealed = false;

      function showMemory() {
        if (revealed) return;
        revealed = true;
        canvas.style.transition = 'opacity .5s ease';
        canvas.style.opacity = '0';
        setTimeout(() => canvas.remove(), 500);
        finishReveal();
      }
      document.getElementById('revealSkip').addEventListener('click', showMemory);

      function setupCanvas() {
        const rect = frame.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const grad = ctx.createLinearGradient(0, 0, rect.width, rect.height);
        grad.addColorStop(0, '#e4c98a');
        grad.addColorStop(0.5, '#c9a05c');
        grad.addColorStop(1, '#a8783c');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, rect.width, rect.height);
        ctx.fillStyle = 'rgba(28,15,20,0.4)';
        ctx.font = '11px Jost, sans-serif';
        ctx.textAlign = 'center';
        for (let y = 20; y < rect.height; y += 34) {
          ctx.fillText('S C R A T C H', rect.width / 2, y);
        }
        ctx.globalCompositeOperation = 'destination-out';
      }
      setupCanvas();

      let scratching = false;
      let lastCheck = 0;

      function scratchAt(x, y) {
        const rect = canvas.getBoundingClientRect();
        ctx.beginPath();
        ctx.arc(x - rect.left, y - rect.top, 26, 0, Math.PI * 2);
        ctx.fill();
      }

      function checkCleared() {
        const now = Date.now();
        if (now - lastCheck < 250) return;
        lastCheck = now;
        const rect = frame.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        const sampleW = 40, sampleH = 40;
        const data = ctx.getImageData(0, 0, canvas.width, canvas.height);
        let cleared = 0, total = 0;
        const stepX = Math.max(1, Math.floor(canvas.width / sampleW));
        const stepY = Math.max(1, Math.floor(canvas.height / sampleH));
        for (let y = 0; y < canvas.height; y += stepY) {
          for (let x = 0; x < canvas.width; x += stepX) {
            const idx = (y * canvas.width + x) * 4 + 3;
            total++;
            if (data.data[idx] < 40) cleared++;
          }
        }
        if (total && cleared / total > 0.45) showMemory();
      }

      function pointerPos(e) {
        if (e.touches && e.touches[0]) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
        return { x: e.clientX, y: e.clientY };
      }

      canvas.addEventListener('pointerdown', e => { scratching = true; const p = pointerPos(e); scratchAt(p.x, p.y); });
      window.addEventListener('pointerup', () => { scratching = false; });
      canvas.addEventListener('pointermove', e => {
        if (!scratching) return;
        const p = pointerPos(e);
        scratchAt(p.x, p.y);
        checkCleared();
      });
      canvas.addEventListener('pointerleave', () => { scratching = false; });
    }

    function renderFinale() {
      setBack(STOPS.length - 1);
      screenEl.innerHTML = `
    <div class="cover-crest">💛</div>
    <h1 class="headline" style="font-size:clamp(24px,7vw,32px);">${FINALE.title}</h1>
    <div class="divider"></div>
    <p class="sub" style="font-size:17px; font-style:italic; color:var(--ivory);">${FINALE.message}</p>
    <div class="gallery" id="gallery"></div>
    <button class="btn ghost small" id="replayBtn" style="margin-top:22px;">Walk through it again</button>
  `;
      const gallery = document.getElementById('gallery');
      STOPS.forEach((s, idx) => {
        const b = document.createElement('button');
        b.innerHTML = s.video ? `<div class="ph">🎬</div>` : (s.image ? `<img src="${s.image}" alt="${s.memoryTitle}" />` : `<div class="ph">✦</div>`);
        b.addEventListener('click', () => openMemoryModal(s));
        gallery.appendChild(b);
      });
      document.getElementById('replayBtn').addEventListener('click', () => go(0));
      launchPetals();
    }

    function openMemoryModal(stop) {
      const back = document.getElementById('modalBack');
      const card = document.getElementById('modalCard');
      card.innerHTML = `
    <div class="photo-frame"${stop.video ? ' style="aspect-ratio:16/9;"' : ''}>
      ${stop.video
          ? `<video src="${stop.video}" controls playsinline></video>`
          : (stop.image ? `<img src="${stop.image}" alt="${stop.memoryTitle}" />` : `<div class="photo-placeholder"><div class="mono">✦</div><small>Photo goes here</small></div>`)
        }
    </div>
    <div class="memory-title" style="opacity:1;transform:none;">${stop.memoryTitle}</div>
    <p class="memory-text" style="opacity:1;transform:none;">${stop.memoryText}</p>
    <button class="btn small" id="closeModal" style="margin-top:16px;">Close</button>
  `;
      back.hidden = false;
      document.getElementById('closeModal').addEventListener('click', () => back.hidden = true);
      back.addEventListener('click', e => { if (e.target === back) back.hidden = true; });
    }

    function launchPetals() {
      const wrap = document.getElementById('petals');
      wrap.hidden = false;
      wrap.innerHTML = '';
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const emojis = ['🌸', '✨', '💛'];
      for (let i = 0; i < 24; i++) {
        const p = document.createElement('div');
        p.className = 'petal';
        p.textContent = emojis[i % emojis.length];
        p.style.left = Math.random() * 100 + 'vw';
        p.style.setProperty('--drift', (Math.random() * 80 - 40) + 'px');
        p.style.animationDuration = (6 + Math.random() * 5) + 's';
        p.style.animationDelay = (Math.random() * 4) + 's';
        p.style.fontSize = (12 + Math.random() * 10) + 'px';
        wrap.appendChild(p);
      }
    }

    function launchBokeh() {
      const wrap = document.getElementById('ambient');
      for (let i = 0; i < 10; i++) {
        const b = document.createElement('div');
        b.className = 'bokeh';
        const size = 40 + Math.random() * 90;
        b.style.width = size + 'px';
        b.style.height = size + 'px';
        b.style.left = Math.random() * 100 + 'vw';
        b.style.top = Math.random() * 100 + 'vh';
        b.style.animationDuration = (10 + Math.random() * 14) + 's';
        b.style.animationDelay = (Math.random() * 6) + 's';
        wrap.appendChild(b);
      }
    }

    launchBokeh();
    render();
  </script>
</body>

</html>
